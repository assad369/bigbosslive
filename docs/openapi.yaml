  /v1/admin/uploads/presign:
    post:
      tags: [Admin]
      summary: Presigned PUT URL for catalog and engagement media
      description: >-
        Each kind needs the permission of the entity it belongs to: catalog.manage (gift-icon,
        gift-animation, vip-badge, vip-frame, cosmetic-asset, cosmetic-preview, level-icon),
        games.manage (game-icon), agencies.manage (agency-logo), config.manage (banner),
        notifications.send (announcement). Types and size limits are ADMIN_UPLOAD_KINDS in
        packages/shared. SVGA uploads as application/octet-stream, Lottie as application/json.
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [kind, contentType, size],
                      properties:
                        {
                          kind:
                            {
                              type: string,
                              enum:
                                [
                                  gift-icon,
                                  gift-animation,
                                  vip-badge,
                                  vip-frame,
                                  cosmetic-asset,
                                  cosmetic-preview,
                                  level-icon,
                                  game-icon,
                                  agency-logo,
                                  banner,
                                  announcement,
                                ],
                            },
                          contentType: { type: string },
                          size:
                            { type: integer, description: Exact byte size; signed into the URL },
                        },
                    },
                },
            },
        }
      responses:
        {
          '200':
            {
              description: '{ uploadUrl, publicUrl, key, expiresIn, headers }. Objects are immutable (Cache-Control is signed).',
            },
          '400': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
        }
