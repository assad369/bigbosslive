openapi: 3.1.0
info:
  title: BigBoss Live API
  version: 1.0.0
  description: |
    REST API for the BigBoss Live app, admin dashboard and games.

    **Auth:** send a Firebase ID token as `Authorization: Bearer <token>`. Call
    `POST /v1/auth/session` once after sign-in to create the profile.

    **Money-moving POSTs** require an `Idempotency-Key` header (8–128 chars). Retrying with the
    same key returns the original result and never charges twice.

    **Errors** look like `{ "error": { "code", "message", "details?", "requestId" } }`.
    Common codes: `unauthorized` (401), `profile_required` (401), `account_banned` (403),
    `device_banned` (403), `forbidden` (403), `not_found` (404), `validation_failed` (422),
    `contact_info_blocked` (422), `insufficient_balance` (402), `rate_limited` (429).

    **Realtime:** Socket.IO at `/socket.io` with `auth: { token }`. Namespace `/`: `chat:message`,
    `chat:read`, `chat:typing`, `notification:new`, `wallet:updated`, `rooms:upserted`,
    `rooms:ended` (after emitting `rooms:subscribe`). Namespace `/games`: emit
    `game:subscribe <key>` (ack returns the state), then receive `game:round`, `game:totals`, `game:settled`.
    In-room events arrive on the LiveKit data channel as `{ topic, payload, ts }` with `bb.*` topics.
servers:
  - url: https://bigbossapi.asadsoft.cloud
    description: Production
  - url: http://localhost:3000
    description: Local development
security:
  - firebase: []
tags:
  - name: Account
  - name: Live
  - name: Economy
  - name: Social
  - name: Games
  - name: Admin
  - name: System

components:
  securitySchemes:
    firebase:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{24}$' }
    Uid:
      name: uid
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    GameKey:
      name: key
      in: path
      required: true
      schema: { type: string, enum: [golden_wheel, teen_patti, fortune_ferris] }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoContent:
      description: No content
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            requestId: { type: string }
    UserBrief:
      type: object
      properties:
        id: { type: string }
        shortId: { type: string }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }
        level: { type: integer }
        vipTier: { type: integer }
        country: { type: [string, 'null'] }
        frameUrl: { type: [string, 'null'] }
    LevelProgress:
      type: object
      properties:
        level: { type: integer }
        points: { type: integer }
        currentLevelPoints: { type: integer }
        nextLevelPoints: { type: [integer, 'null'] }
        isMaxLevel: { type: boolean }
    Wallet:
      type: object
      properties:
        diamonds: { type: integer }
        beans: { type: integer }
        agentStock: { type: integer }
    MeUser:
      allOf:
        - $ref: '#/components/schemas/UserBrief'
        - type: object
          properties:
            bio: { type: string }
            followers: { type: integer }
            following: { type: integer }
            isLive: { type: boolean }
            liveRoomId: { type: [string, 'null'] }
            status: { type: string, enum: [active, banned, deleted] }
            isAgent: { type: boolean }
            adminRole: { type: [string, 'null'] }
            wallet: { $ref: '#/components/schemas/Wallet' }
            levelProgress: { $ref: '#/components/schemas/LevelProgress' }
            vipExpiresAt: { type: [string, 'null'], format: date-time }
    ProfileInput:
      type: object
      properties:
        displayName: { type: string, minLength: 2, maxLength: 30 }
        avatarUrl: { type: [string, 'null'], format: uri }
        bio: { type: string, maxLength: 160 }
        gender: { type: [string, 'null'], enum: [male, female, other, null] }
        birthday: { type: [string, 'null'], format: date }
        country: { type: [string, 'null'], minLength: 2, maxLength: 2 }
    LiveRoom:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [video, audio] }
        status: { type: string, enum: [live, ended] }
        title: { type: string }
        coverUrl: { type: [string, 'null'] }
        host: { $ref: '#/components/schemas/UserBrief' }
        viewerCount: { type: integer }
        peakViewers: { type: integer }
        giftBeans: { type: integer }
        pkBattleId: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
    LiveSession:
      type: object
      properties:
        room:
          allOf:
            - $ref: '#/components/schemas/LiveRoom'
            - type: object
              properties:
                livekitRoom: { type: string }
                moderatorIds: { type: array, items: { type: string } }
                seats:
                  type: array
                  items:
                    type: object
                    properties:
                      index: { type: integer }
                      user:
                        { oneOf: [{ $ref: '#/components/schemas/UserBrief' }, { type: 'null' }] }
                      muted: { type: boolean }
                      locked: { type: boolean }
        credentials:
          type: object
          properties:
            token: { type: string, description: LiveKit access token }
            url: { type: string }
            identity: { type: string }
            role: { type: string, enum: [host, moderator, guest, audience] }
    Gift:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer }
        iconUrl: { type: string }
        animationUrl: { type: [string, 'null'] }
        animationFormat: { type: string, enum: [none, svga, lottie, mp4] }
        category: { type: string }
        vipTierRequired: { type: integer }
    LedgerEntry:
      type: object
      properties:
        id: { type: string }
        currency: { type: string, enum: [diamonds, beans, agent_stock] }
        delta: { type: integer }
        balanceAfter: { type: integer }
        reason: { type: string }
        refId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    PkBattle:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, active, ended, rejected, cancelled, expired] }
        hosts:
          type: array
          items:
            type: object
            properties:
              uid: { type: string }
              roomId: { type: string }
              score: { type: integer }
              displayName: { type: string }
              avatarUrl: { type: [string, 'null'] }
        durationSec: { type: integer }
        startedAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        winnerUid: { type: [string, 'null'] }
        isDraw: { type: boolean }
    GameRound:
      type: object
      properties:
        id: { type: string }
        game: { type: string }
        roundNo: { type: integer }
        status: { type: string, enum: [betting, locked, settled] }
        serverSeedHash: { type: string }
        serverSeed: { type: [string, 'null'], description: Revealed after settlement }
        options: { type: array, items: { type: string } }
        totals: { type: object, additionalProperties: { type: integer } }
        outcome: { type: [string, 'null'] }
        reveal: { type: [object, 'null'] }
        bettingStartedAt: { type: string, format: date-time }
        bettingEndsAt: { type: string, format: date-time }
        settlesAt: { type: string, format: date-time }
    CursorPage:
      type: object
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: [string, 'null'] }

paths:
  /healthz:
    get:
      tags: [System]
      security: []
      summary: Liveness probe
      responses: { '200': { description: OK } }
  /readyz:
    get:
      tags: [System]
      security: []
      summary: Readiness probe (MongoDB + Redis)
      responses: { '200': { description: Ready }, '503': { description: Not ready } }

  /v1/config/app:
    get:
      tags: [System]
      security: []
      summary: Public app config (maintenance, min build, feature flags, PK durations)
      responses: { '200': { description: OK } }
  /v1/levels:
    get:
      tags: [System]
      security: []
      summary: Level ladder
      responses: { '200': { description: OK } }

  /v1/auth/session:
    post:
      tags: [Account]
      summary: Create (first sign-in) or refresh the caller's profile
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } }
      responses:
        '200':
          {
            description: Existing profile,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            user: { $ref: '#/components/schemas/MeUser' },
                            created: { type: boolean },
                          },
                      },
                  },
              },
          }
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Error' }
  /v1/me:
    get:
      tags: [Account]
      summary: The caller's profile, wallet and level progress
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        {
          '200': { description: OK },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
        }
    patch:
      tags: [Account]
      summary: Update profile (moderated)
      requestBody:
        { content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [Account]
      summary: Delete the account (anonymises profile, deletes Firebase user)
      responses: { '204': { $ref: '#/components/responses/NoContent' } }
  /v1/me/push-tokens:
    post:
      tags: [Account]
      summary: Register an FCM token
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [token, platform],
                      properties:
                        {
                          token: { type: string },
                          platform: { type: string, enum: [android, ios, web] },
                        },
                    },
                },
            },
        }
      responses: { '204': { $ref: '#/components/responses/NoContent' } }
    delete:
      tags: [Account]
      summary: Remove an FCM token (sign-out)
      responses: { '204': { $ref: '#/components/responses/NoContent' } }
  /v1/me/blocked:
    get: { tags: [Account], summary: Blocked users, responses: { '200': { description: OK } } }
  /v1/users/search:
    get:
      tags: [Account]
      summary: Search by short id or display-name prefix
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /v1/users/{uid}:
    get:
      {
        tags: [Account],
        summary: Public profile,
        parameters: [{ $ref: '#/components/parameters/Uid' }],
        responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } },
      }
  /v1/users/{uid}/follow:
    post:
      {
        tags: [Account],
        summary: Follow,
        parameters: [{ $ref: '#/components/parameters/Uid' }],
        responses: { '200': { description: '{ followed }' } },
      }
    delete:
      {
        tags: [Account],
        summary: Unfollow,
        parameters: [{ $ref: '#/components/parameters/Uid' }],
        responses: { '200': { description: '{ unfollowed }' } },
      }
  /v1/users/{uid}/followers:
    get:
      {
        tags: [Account],
        summary: Followers (cursor),
        parameters:
          [
            { $ref: '#/components/parameters/Uid' },
            { $ref: '#/components/parameters/Cursor' },
            { $ref: '#/components/parameters/Limit' },
          ],
        responses: { '200': { description: OK } },
      }
  /v1/users/{uid}/following:
    get:
      {
        tags: [Account],
        summary: Following (cursor),
        parameters:
          [
            { $ref: '#/components/parameters/Uid' },
            { $ref: '#/components/parameters/Cursor' },
            { $ref: '#/components/parameters/Limit' },
          ],
        responses: { '200': { description: OK } },
      }
  /v1/users/{uid}/block:
    post:
      {
        tags: [Account],
        summary: Block (also removes follows),
        parameters: [{ $ref: '#/components/parameters/Uid' }],
        responses: { '204': { $ref: '#/components/responses/NoContent' } },
      }
    delete:
      {
        tags: [Account],
        summary: Unblock,
        parameters: [{ $ref: '#/components/parameters/Uid' }],
        responses: { '204': { $ref: '#/components/responses/NoContent' } },
      }
  /v1/users/{uid}/contributors:
    get:
      {
        tags: [Account],
        summary: Top gifters to a user,
        parameters:
          [
            { $ref: '#/components/parameters/Uid' },
            { name: period, in: query, schema: { type: string, enum: [day, week, month, all] } },
          ],
        responses: { '200': { description: OK } },
      }
  /v1/users/{uid}/live-history:
    get:
      {
        tags: [Live],
        summary: Own streaming history,
        parameters:
          [{ $ref: '#/components/parameters/Uid' }, { $ref: '#/components/parameters/Page' }],
        responses: { '200': { description: OK } },
      }
  /v1/reports:
    post:
      tags: [Account]
      summary: Report a user, room, post, comment or message
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [targetType, targetId, reason],
                      properties:
                        {
                          targetType: { type: string, enum: [user, room, post, comment, message] },
                          targetId: { type: string },
                          reason:
                            {
                              type: string,
                              enum:
                                [spam, harassment, nudity, violence, hate, scam, underage, other],
                            },
                          details: { type: string },
                        },
                    },
                },
            },
        }
      responses:
        { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } }
  /v1/uploads/presign:
    post:
      tags: [Account]
      summary: Presigned PUT URL for avatar, cover, post, chat or report media
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        {
                          kind: { type: string, enum: [avatar, cover, post, chat, report] },
                          contentType: { type: string },
                          size:
                            {
                              type: integer,
                              description: 'Optional byte size. When sent it is capped per kind and signed, so the PUT must match it.',
                            },
                        },
                    },
                },
            },
        }
      responses:
        {
          '200':
            {
              description: '{ uploadUrl, publicUrl, key, expiresIn, headers }. PUT the file to uploadUrl sending exactly `headers`.',
            },
          '400': { $ref: '#/components/responses/Error' },
        }
  /v1/banners:
    get:
      {
        tags: [System],
        summary: Active banners,
        parameters:
          [
            {
              name: placement,
              in: query,
              schema: { type: string, enum: [home, live, wallet, games] },
            },
          ],
        responses: { '200': { description: OK } },
      }
  /v1/leaderboards/{kind}:
    get:
      {
        tags: [Economy],
        summary: Rich / charm rankings,
        parameters:
          [
            { name: kind, in: path, required: true, schema: { type: string, enum: [rich, charm] } },
            { name: period, in: query, schema: { type: string, enum: [day, week, month] } },
          ],
        responses: { '200': { description: OK } },
      }

  /v1/live:
    get:
      tags: [Live]
      summary: Live directory
      parameters:
        - {
            name: tab,
            in: query,
            schema: { type: string, enum: [popular, new, following, nearby] },
          }
        - { name: type, in: query, schema: { type: string, enum: [video, audio] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { description: OK } }
    post:
      tags: [Live]
      summary: Go live (resumes the host's existing room)
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        {
                          title:
                            {
                              type: string,
                              maxLength: 60,
                              description: "Optional. Empty or missing defaults to the host's display name.",
                            },
                          type: { type: string, enum: [video, audio] },
                          coverUrl:
                            {
                              type: [string, 'null'],
                              description: "Optional. Null defaults to the host's avatar.",
                            },
                          tags: { type: array, items: { type: string } },
                        },
                    },
                },
            },
        }
      responses:
        {
          '201':
            {
              description: Started,
              content:
                { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } },
            },
          '200': { description: Resumed },
        }
  /v1/live/{id}:
    get:
      {
        tags: [Live],
        summary: Room detail,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: OK } },
      }
    patch:
      {
        tags: [Live],
        summary: Update title / background / cover (host),
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: OK } },
      }
  /v1/live/{id}/join:
    post:
      {
        tags: [Live],
        summary: Join and get a LiveKit token,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses:
          {
            '200':
              {
                description: OK,
                content:
                  { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } },
              },
            '403': { $ref: '#/components/responses/Error' },
            '410': { $ref: '#/components/responses/Error' },
          },
      }
  /v1/live/{id}/heartbeat:
    post:
      {
        tags: [Live],
        summary: Host keep-alive (every ~25 s),
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses:
          {
            '204': { $ref: '#/components/responses/NoContent' },
            '410': { $ref: '#/components/responses/Error' },
          },
      }
  /v1/live/{id}/chat:
    post:
      {
        tags: [Live],
        summary: Moderated in-room chat (rate limited),
        parameters: [{ $ref: '#/components/parameters/Id' }],
        requestBody:
          {
            content:
              {
                application/json:
                  {
                    schema:
                      { type: object, properties: { text: { type: string, maxLength: 300 } } },
                  },
              },
          },
        responses:
          { '201': { description: Sent }, '422': { $ref: '#/components/responses/Error' } },
      }
  /v1/live/{id}/end:
    post:
      {
        tags: [Live],
        summary: End live (host),
        returns a summary,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: OK } },
      }
  /v1/live/{id}/viewers:
    get:
      {
        tags: [Live],
        summary: Current viewers,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: OK } },
      }
  /v1/live/{id}/kick:
    post:
      {
        tags: [Live],
        summary: Remove (and optionally ban) a viewer — host/moderator,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '204': { $ref: '#/components/responses/NoContent' } },
      }
  /v1/live/{id}/moderators:
    post:
      {
        tags: [Live],
        summary: Grant/revoke room moderator (host),
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '204': { $ref: '#/components/responses/NoContent' } },
      }
  /v1/live/{id}/seats/request:
    post:
      {
        tags: [Live],
        summary: Request a seat,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '202': { description: Requested } },
      }
  /v1/live/{id}/seats/requests:
    get:
      {
        tags: [Live],
        summary: Pending seat requests (host/moderator),
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: OK } },
      }
  /v1/live/{id}/seats/requests/{userId}:
    post:
      {
        tags: [Live],
        summary: Accept/reject a seat request,
        parameters:
          [
            { $ref: '#/components/parameters/Id' },
            { name: userId, in: path, required: true, schema: { type: string } },
          ],
        responses: { '200': { description: OK } },
      }
  /v1/live/{id}/seats/invite:
    post:
      {
        tags: [Live],
        summary: Invite a viewer to a seat,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '202': { description: Invited } },
      }
  /v1/live/{id}/seats/invite/respond:
    post:
      {
        tags: [Live],
        summary: Accept/decline a seat invitation,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: OK } },
      }
  /v1/live/{id}/seats/leave:
    post:
      {
        tags: [Live],
        summary: Leave your seat,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '204': { $ref: '#/components/responses/NoContent' } },
      }
  /v1/live/{id}/seats/{index}:
    post:
      {
        tags: [Live],
        summary: 'Seat action: remove | mute | unmute | lock | unlock',
        parameters:
          [
            { $ref: '#/components/parameters/Id' },
            { name: index, in: path, required: true, schema: { type: integer } },
          ],
        responses: { '204': { $ref: '#/components/responses/NoContent' } },
      }
  /v1/live/{id}/pk:
    get:
      {
        tags: [Live],
        summary: Active/pending PK for a room,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: OK } },
      }
  /v1/live/bans:
    get:
      {
        tags: [Live],
        summary: Users banned from your rooms,
        responses: { '200': { description: OK } },
      }
  /v1/webhooks/livekit:
    post:
      {
        tags: [Live],
        security: [],
        summary: LiveKit webhook (signed,
        raw body),
        responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Error' } },
      }

  /v1/pk/invite:
    post:
      {
        tags: [Live],
        summary: Invite a live host to PK,
        requestBody:
          {
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { opponentId: { type: string }, durationSec: { type: integer } },
                      },
                  },
              },
