group 'com.bigbosslive.camera_filter'
version '1.0'

// Modelled on third_party/flutter_webrtc/android/build.gradle, which builds in this app.
buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'

// AGP 9's built-in Kotlin rejects the Kotlin Gradle Plugin: apply KGP only when it is off
// (AGP < 9, or android.builtInKotlin=false as the app sets today).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty('android.builtInKotlin') ||
        Boolean.parseBoolean(project.property('android.builtInKotlin').toString()))
if (!builtInKotlinActive) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.bigbosslive.camera_filter'
    }
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

def kotlinExt = project.extensions.findByName('kotlin')
if (kotlinExt?.hasProperty('compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

dependencies {
    // flutter_webrtc ships WebRTC at runtime (the Flutter tool adds project(':flutter_webrtc')
    // because pubspec.yaml depends on it). Keep this in step with its android/build.gradle.
    compileOnly 'io.github.webrtc-sdk:android:150.7871.04'
}
